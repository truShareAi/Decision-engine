<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOS | Luxury Athletic Wear</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Archive&family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- HIGH-END COLD LUXURY PALETTE --- */
        :root {
            --bg-deep: #080808;        /* True deep rich black */
            --bg-charcoal: #121212;    /* Sleek dark gray panels */
            --border-gray: #1f1f1f;    /* Razor-thin structural borders */
            --text-pure: #ffffff;      /* High contrast white */
            --text-premium: #e5e5e5;   /* Premium light gray text */
            --text-dim: #666666;       /* Industrial muted gray */
            --axios-neon: #22c55e;     /* Sharp energetic accent green */
        }

   <body>

    <nav class="top-nav" id="mainNav"></nav>

    <!-- HERO -->
    <section class="hero-section">

        <div class="hero-slider">

            <div class="hero-slide active">
                <img src="images/slider-1.jpg" alt="AXIOS Mens Performance Wear">
            </div>

            <div class="hero-slide">
                <img src="images/slider-2.jpg" alt="AXIOS Womens Activewear">
            </div>

            <div class="hero-slide">
                <img src="images/slider-3.jpg" alt="AXIOS Accessories">
            </div>

        </div>

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div class="hero-subtitle">
                AXIOS PERFORMANCE
            </div>

            <h1 class="hero-title">
                Built For Motion.
            </h1>

            <p class="hero-description">
                Premium athletic wear engineered for modern training, recovery and elevated everyday movement.
            </p>

            <a href="#collection" class="hero-button">
                Explore Collection
            </a>
        </div>

    </section>

    <!-- COLLECTION -->
    <section class="collection-section" id="collection">

        <div class="section-heading">
            <h2>Latest Collection</h2>
            <p>Drop 01 / Performance Luxury</p>
        </div>

        <div class="product-grid">

            <!-- PRODUCT 1 -->
            <div class="product-card">

                <div class="product-image">
                    <img src="images/product-1.jpg" alt="AXIOS Active Tee">
                </div>

                <div class="product-meta">

                    <div class="product-category">
                        Performance Essentials
                    </div>

                    <div class="product-row">
                        <div class="product-title">
                            Comfort Fit Active Tee
                        </div>

                        <div class="product-price">
                            £34
                        </div>
                    </div>

                </div>

            </div>

            <!-- PRODUCT 2 -->
            <div class="product-card">

                <div class="product-image">
                    <img src="images/product-2.jpg" alt="AXIOS Elite Shorts Set">
                </div>

                <div class="product-meta">

                    <div class="product-category">
                        Womens Performance
                    </div>

                    <div class="product-row">
                        <div class="product-title">
                            Elite Training Set
                        </div>

                        <div class="product-price">
                            £48
                        </div>
                    </div>

                </div>

            </div>

            <!-- PRODUCT 3 -->
            <div class="product-card">

                <div class="product-image">
                    <img src="images/product-3.jpg" alt="AXIOS Flask">
                </div>

                <div class="product-meta">

                    <div class="product-category">
                        Accessories
                    </div>

                    <div class="product-row">
                        <div class="product-title">
                            Matte Steel Flask
                        </div>

                        <div class="product-price">
                            £22
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- FEATURE BANNER -->
    <section class="feature-banner">

        <img src="images/slider-2.jpg" alt="AXIOS Performance Lifestyle">

        <div class="feature-banner-content">

            <h2>
                Precision In Every Layer.
            </h2>

            <p>
                Elevated silhouettes, technical materials and understated luxury designed for high performance environments.
            </p>

        </div>

    </section>

    <footer class="site-footer" id="mainFooter"></footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            fetch('components/nav.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('mainNav').innerHTML = data;
                });

            fetch('components/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('mainFooter').innerHTML = data;
                });

        });
    </script>

    <script src="js/app.js"></script>

</body>
</html>
