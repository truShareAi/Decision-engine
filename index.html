<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana | Find Anything</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .hero-area {
            padding: 20px 20px 40px;
            text-align: center;
            position: relative;
            margin-top: 20px;
        }

        .hero-text h1 {
            font-size: 3rem;
            margin: 0;
            line-height: 1.2;
        }

        .hero-text p {
            margin-top: 10px;
            opacity: 0.8;
        }

        .pop {
            color: #fde047;
        }

        /* SEARCH */
        .search-container {
            max-width: 600px;
            margin: 30px auto 10px;
        }

        .search-wrap {
            display: flex;
            background: white;
            border-radius: 50px;
            overflow: hidden;
        }

        .search-wrap input {
            flex: 1;
            border: none;
            padding: 15px;
            outline: none;
            font-size: 1rem;
        }

        .search-wrap button {
            background: #38bdf8;
            border: none;
            color: white;
            padding: 15px 25px;
            font-weight: 700;
            cursor: pointer;
        }

        /* SUGGESTIONS */
        .suggestions {
            margin-top: 15px;
        }

        .suggestions span {
            display: inline-block;
            margin: 5px;
            padding: 6px 12px;
            background: #1e293b;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .suggestions span:hover {
            background: #38bdf8;
        }

        /* RESULTS */
        .results {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .result-main {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #fde047;
        }

        .result-main h2 {
            margin: 0 0 10px;
        }

        .result-main p {
            opacity: 0.8;
        }

        .result-main button {
            margin-top: 10px;
            background: #fde047;
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            cursor: pointer;
        }

        .result-list {
            display: grid;
            gap: 10px;
        }

        .result-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        /* LOADING */
        .loading {
            text-align: center;
            opacity: 0.7;
        }

        /* AD */
        .ad-banner {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1e293b;
            text-align: center;
            border-radius: 10px;
            opacity: 0.7;
        }
        
        /* Navbar & Footer Styles */
        .top-nav {
            min-height: 145px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        
        .nav-logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }
        
        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        
        .nav-links a:hover {
            color: #38bdf8;
        }
        
        .site-footer {
            text-align: center;
            padding: 30px;
            background: #0f172a;
            color: #94a3b8;
            border-top: 1px solid #1e293b;
            margin-top: 40px;
        }
    </style>
</head>
<body style="background-color: #0f172a; color: white; font-family: system-ui, sans-serif; margin: 0;">

    <nav class="top-nav" id="mainNav"></nav>

    <section class="hero-area">
        <div class="hero-text">
            <h1>Describe it.<br><span class="pop">We’ll find it.</span></h1>
            <p>Weird problems, smart products. Just type what you need.</p>
        </div>

        <div class="search-container">
            <div class="search-wrap">
                <input type="text" id="mainSearchInput" placeholder="e.g. tool to rip weeds out of garden">
                <button onclick="handleSearch()">Search</button>
            </div>

            <div class="suggestions">
                <span onclick="quickSearch('cheap home gym setup')">Home gym</span>
                <span onclick="quickSearch('cable organiser for desk')">Cable mess</span>
                <span onclick="quickSearch('tool to remove weeds')">Garden</span>
                <span onclick="quickSearch('budget gaming setup')">Gaming</span>
            </div>
        </div>
    </section>

    <section class="results">
        <div id="loadingState" class="loading" style="display:none;">
            <p>🍌 Finding the best stuff...</p>
        </div>

        <div id="resultsSection"></div>
    </section>

    <section class="results">
        <h2 style="margin-bottom: 20px; color: #fde047;">Today's Top Deals</h2>
        <div id="dealsContainer" class="result-list"></div>
    </section>

    <div class="ad-banner">
        <p>Sponsored</p>
    </div>

    <footer class="site-footer" id="mainFooter"></footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Load Navigation
            fetch('components/nav.html')
                .then(response => {
                    if (!response.ok) throw new Error('Could not load nav.html');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('mainNav').innerHTML = data;
                })
                .catch(error => console.error('Error loading navigation:', error));

            // Load Footer
            fetch('components/footer.html')
                .then(response => {
                    if (!response.ok) throw new Error('Could not load footer.html');
                    return response.text();
                })
                .then(data => {
                    document.getElementById('mainFooter').innerHTML = data;
                })
                .catch(error => console.error('Error loading footer:', error));
        });
    </script>

    <script src="js/app.js"></script>

</body>
</html>
