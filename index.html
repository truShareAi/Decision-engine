<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana | Find Anything</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .hero-area {
            padding: 80px 20px 40px;
            text-align: center;
            position: relative;
        }

        .hero-text h1 {
            font-size: 3rem;
            margin: 0;
            line-height: 1.2;
        }

        .hero-text p {
            margin-top: 10px;
            opacity: 0.8;
        }

        .pop {
            color: #fde047;
        }

        .hero-mascot {
            position: absolute;
            right: 40px;
            top: 10px;
            max-width: 200px;
            opacity: 0.9;
        }

        .hero-mascot img {
            width: 100%;
        }

        /* SEARCH */
        .search-container {
            max-width: 600px;
            margin: 30px auto 10px;
        }

        .search-wrap {
            display: flex;
            background: white;
            border-radius: 50px;
            overflow: hidden;
        }

        .search-wrap input {
            flex: 1;
            border: none;
            padding: 15px;
            outline: none;
            font-size: 1rem;
        }

        .search-wrap button {
            background: #38bdf8;
            border: none;
            color: white;
            padding: 15px 25px;
            font-weight: 700;
            cursor: pointer;
        }

        /* SUGGESTIONS */
        .suggestions {
            margin-top: 15px;
        }

        .suggestions span {
            display: inline-block;
            margin: 5px;
            padding: 6px 12px;
            background: #1e293b;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .suggestions span:hover {
            background: #38bdf8;
        }

        /* RESULTS */
        .results {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .result-main {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #fde047;
        }

        .result-main h2 {
            margin: 0 0 10px;
        }

        .result-main p {
            opacity: 0.8;
        }

        .result-main button {
            margin-top: 10px;
            background: #fde047;
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            cursor: pointer;
        }

        .result-list {
            display: grid;
            gap: 10px;
        }

        .result-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
        }

        /* LOADING */
        .loading {
            text-align: center;
            opacity: 0.7;
        }

        /* AD */
        .ad-banner {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1e293b;
            text-align: center;
            border-radius: 10px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<nav class="top-nav" id="mainNav"></nav>

<!-- HERO -->
<section class="hero-area">
    <div class="hero-text">
        <h1>Describe it.<br><span class="pop">We’ll find it.</span></h1>
        <p>Weird problems, smart products. Just type what you need.</p>
    </div>

    <div class="search-container">
        <div class="search-wrap">
            <input type="text" id="mainSearchInput" placeholder="e.g. tool to rip weeds out of garden">
            <button onclick="handleSearch()">Search</button>
        </div>

        <div class="suggestions">
            <span onclick="quickSearch('cheap home gym setup')">Home gym</span>
            <span onclick="quickSearch('cable organiser for desk')">Cable mess</span>
            <span onclick="quickSearch('tool to remove weeds')">Garden</span>
            <span onclick="quickSearch('budget gaming setup')">Gaming</span>
        </div>
    </div>

    <div class="hero-mascot">
        <img src="images/mascot.png" alt="Banana Mascot">
    </div>
</section>

<!-- RESULTS -->
<section class="results">
    <div id="loadingState" class="loading" style="display:none;">
        <p>🍌 Finding the best stuff...</p>
    </div>

    <div id="resultsSection"></div>
</section>

<!-- AD -->
<div class="ad-banner">
    <p>Sponsored</p>
</div>

<footer class="site-footer" id="mainFooter
